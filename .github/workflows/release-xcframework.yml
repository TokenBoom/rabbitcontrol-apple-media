name: Release xcframework

# tag(push v*)或手动触发:构建 iOS 预编译产物 RabbitControlCore.xcframework 并发布到 GitHub Release。
# iOS 仓 CI 直接下载该产物,不再现场编译 Rust。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "发布到哪个 tag(须已存在或随本次创建)"
        required: true

permissions:
  contents: write

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust iOS targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Setup private-repo access
        env:
          CORE_READ_TOKEN: ${{ secrets.CORE_READ_TOKEN }}
        run: |
          # rabbitcontrol-core 为私有仓:cargo 的 git+tag 依赖拉取需要读权限。
          git config --global url."https://x-access-token:${CORE_READ_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Build & package xcframework
        env:
          RC_INCLUDE_X86_64_SIM: "1"
          RC_PACKAGE_ARCHIVE: "1"
        run: ./scripts/build-xcframework.sh build

      - name: Verify archive checksums
        run: |
          cd build
          shasum -a 256 -c SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "$TAG" = "main" ] || [ -z "$TAG" ]; then TAG="${{ inputs.release_tag }}"; fi
          gh release create "$TAG" --title "$TAG" --notes "预编译 RabbitControlCore.xcframework" 2>/dev/null || true
          gh release upload "$TAG" build/RabbitControlCore.xcframework.tar.gz build/SHA256SUMS.txt --clobber
