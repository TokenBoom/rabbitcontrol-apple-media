[workspace]
resolver = "2"
members = [
    "crates/rc-decode-vt",
    "crates/rc-media-apple",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-only"

[workspace.dependencies]
rc-capture = { git = "https://github.com/TokenBoom/rabbitcontrol-core.git", tag = "v0.1.8" }
rc-client-core = { git = "https://github.com/TokenBoom/rabbitcontrol-core.git", tag = "v0.1.8" }
rc-decode = { git = "https://github.com/TokenBoom/rabbitcontrol-core.git", tag = "v0.1.8" }
rc-encode = { git = "https://github.com/TokenBoom/rabbitcontrol-core.git", tag = "v0.1.8" }
rc-pipeline = { git = "https://github.com/TokenBoom/rabbitcontrol-core.git", tag = "v0.1.8" }
rc-render = { git = "https://github.com/TokenBoom/rabbitcontrol-core.git", tag = "v0.1.8" }
rc-types = { git = "https://github.com/TokenBoom/rabbitcontrol-core.git", tag = "v0.1.8" }
