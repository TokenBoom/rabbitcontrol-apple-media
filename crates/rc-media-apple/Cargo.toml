[package]
name = "rc-media-apple"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RabbitControl Apple 平台媒体库:VideoToolbox 硬件解码 + 帧泵渲染,FFI 暴露给 iOS/macOS 客户端。"
# examples/e2e_session.rs 依赖尚未合入 rabbitcontrol-core main 的 rc-mobile-ffi，保留源文件但默认不自动编译。
autoexamples = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
rc-audio = { workspace = true }
rc-session = { workspace = true }
rc-decode-vt = { path = "../rc-decode-vt" }
rc-client-core = { workspace = true }
rc-pipeline = { workspace = true }
rc-render = { workspace = true }
rc-decode = { workspace = true }
rc-capture = { workspace = true }
rc-types = { workspace = true }
serde_json = "1"

[dev-dependencies]
rc-encode = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-foundation = { version = "0.3", features = ["CFDictionary", "CFNumber", "CFString"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"

[[bench]]
name = "codec_bench"
harness = false
